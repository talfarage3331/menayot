name: Update earnings calendar

# The schedule is deliberately switched off. The calendar source refuses
# requests from datacenter addresses: a run from a GitHub runner fetched 0 of
# the days it asked for, and so did every run from the development container.
# Leaving a daily cron in place would just fail every morning and bury real
# failures in noise.
#
# Re-enable it only once the fetch succeeds from CI — either because the
# source starts answering, or because the script is pointed at a provider that
# serves servers. Run it by hand with a small `days` value to check.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days of calendar to walk (small values are for probing the source)'
        required: false
        default: '45'

permissions:
  contents: write

concurrency:
  group: earnings
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Capped well under the job limit: if the source starts refusing
      # requests, each day burns its retries and the run would otherwise sit
      # there for half an hour before failing.
      - name: Fetch the earnings calendar
        timeout-minutes: 12
        run: |
          node scripts/fetch-earnings.mjs "$RUNNER_TEMP/earnings.json" \
            "${{ inputs.days || '45' }}"

      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The data branch carries the generated feeds and no history worth
          # keeping, so each run rewrites it. prices.json is fetched from the
          # branch first and put back, because the price workflow writes the
          # same branch far more often and must not lose its file here.
          work="$RUNNER_TEMP/data"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Keep whatever the branch already holds, then replace only earnings.
          if git fetch -q --depth 1 "$remote" data 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . || true
          fi

          cp "$RUNNER_TEMP/earnings.json" earnings.json
          git add -A
          git commit -q -m "earnings: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push -q --force "$remote" HEAD:refs/heads/data
