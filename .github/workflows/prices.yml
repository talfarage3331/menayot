name: Update prices

on:
  schedule:
    # Every 10 minutes while US markets are open, covering both EST and EDT
    # plus a little pre- and after-hours.
    #
    # Deliberately not '*/5', even though 5 minutes is GitHub's documented
    # floor: runs at the floor are the first to be dropped when the platform
    # is busy, and in practice none fired at all. The offset minutes keep it
    # away from the top-of-the-hour rush, when scheduled workflows queue up.
    # GitHub still runs these on a best-effort basis — never present the
    # prices as tick-by-tick live.
    - cron: '4,14,24,34,44,54 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# A late run must never overwrite a newer one's prices.
concurrency:
  group: prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch quotes
        run: node scripts/fetch-prices.mjs "$RUNNER_TEMP/prices.json"

      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The data branch holds one generated file and no history worth
          # keeping, so each run replaces it outright. That keeps the
          # repository from growing by a commit every five minutes.
          work="$RUNNER_TEMP/data"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp "$RUNNER_TEMP/prices.json" prices.json
          git add prices.json
          git commit -q -m "prices: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/data
